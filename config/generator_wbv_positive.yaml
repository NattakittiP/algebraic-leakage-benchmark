# generator_wbv_positive.yaml
# WBV positive-control scenario: WBV has a real, large effect on TCR.
# This is the only scenario where the WBV hypothesis is TRUE.
# Expected clean AUROC: 0.80+
# Use this scenario to verify that the clean pipeline CAN detect a real signal.

scenario: wbv_positive
n: 1500

# --- Demographics ---
age_mu: 53.0
age_sd: 10.0
age_low: 18.0
age_high: 75.0

p_male: 0.485

bmi_mu: 24.0
bmi_sd: 3.0
bmi_low: 16.0
bmi_high: 33.0

# --- Haematological ---
hct_mu: 41.7
hct_sd: 3.75
hct_low: 30.0
hct_high: 55.0

tp_mu: 6.88
tp_sd: 0.62
tp_low: 5.0
tp_high: 8.9

# --- Lipids ---
hdl_mu: 50.5
hdl_sd: 9.7
hdl_low: 25.0
hdl_high: 87.0

ldl_mu: 131.0
ldl_sd: 28.0
ldl_low: 70.0
ldl_high: 215.0

# --- TG0h ---
tg0h_shift: 350.0
tg0h_mu_log: 5.5
tg0h_sigma_log: 0.45
tg0h_low: 350.0
tg0h_high: 1750.0

# --- TCR with strong WBV effect ---
tcr_mu: 52.2
tcr_sd: 18.6
tcr_low: -10.0
tcr_high: 99.9

# Large positive WBV effect: higher WBV → markedly higher TCR
# Calibrated: signal R ≈ 0.68 → AUROC ≈ 0.85  (target 0.80+)
# Noise fraction reduced to 0.40 inside generator for strong separation
# Generator uses empirical z-score (wbv_mean/wbv_sd not needed)
beta_wbv: 7.0

tg4h_max: 1300.0
