# generator_null.yaml
# Null scenario: TCR is independent of all predictors.
# Expected clean AUROC: 0.48–0.52 (at-chance performance)
# This is the primary benchmark scenario.

scenario: "null"
n: 1500

# --- Demographics ---
age_mu: 53.0
age_sd: 10.0
age_low: 18.0
age_high: 75.0

p_male: 0.485    # probability of male sex

bmi_mu: 24.0
bmi_sd: 3.0
bmi_low: 16.0
bmi_high: 33.0

# --- Haematological variables (for WBV) ---
hct_mu: 41.7    # haematocrit (%)
hct_sd: 3.75
hct_low: 30.0
hct_high: 55.0

tp_mu: 6.88     # total protein (g/dL)
tp_sd: 0.62
tp_low: 5.0
tp_high: 8.9

# WBV = 0.12 * Hct + 0.17 * (TP - 2.07)  — computed in code, not configured here

# --- Lipid panel ---
hdl_mu: 50.5
hdl_sd: 9.7
hdl_low: 25.0
hdl_high: 87.0

ldl_mu: 131.0
ldl_sd: 28.0
ldl_low: 70.0
ldl_high: 215.0

# --- Baseline triglyceride (TG0h) — shifted lognormal ---
tg0h_shift: 350.0       # additive shift so minimum ≈ 350 mg/dL
tg0h_mu_log: 5.5        # log-scale mean
tg0h_sigma_log: 0.45    # log-scale SD
tg0h_low: 350.0         # truncation lower bound (mg/dL)
tg0h_high: 1750.0       # truncation upper bound (mg/dL)

# --- TCR (primary latent response) — null: independent of all predictors ---
tcr_mu: 52.2    # triglyceride clearance rate (%) — population mean
tcr_sd: 18.6
tcr_low: -10.0   # allow small negatives for physiological realism
tcr_high: 99.9

# NOTE: TG4h is derived AFTER TCR: TG4h = TG0h * (1 - TCR/100)
# DO NOT add any predictors of TCR in this scenario.

# --- Plausibility bounds ---
tg4h_max: 1300.0    # post-heparin TG ceiling (mg/dL); values above are clipped
