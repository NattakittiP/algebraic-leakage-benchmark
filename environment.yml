name: tcr-benchmark
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core scientific
  - numpy=1.26.*
  - pandas=2.1.*
  - scipy=1.11.*

  # Machine learning
  - scikit-learn=1.4.*

  # Plotting
  - matplotlib=3.8.*
  - seaborn=0.13.*

  # Notebooks
  - jupyter
  - ipykernel
  - nbformat

  # Pipeline / parallelism
  - joblib=1.3.*
  - pyyaml=6.0.*

  # Testing
  - pytest=7.4.*
  - pytest-cov

  # pip-only packages
  - pip:
    - imbalanced-learn==0.11.0
    - xgboost==2.0.3
    - shap==0.44.0
    - tqdm==4.66.2
    - pre-commit
